# yaml-language-server: $schema=https://coderabbit.ai/integrations/schema.v2.json
# CodeRabbit configuration planted by the hallucinogen loop (C96/V586).
# Quiet reviews, no blocking reviews, no chat replies unless asked, and no
# review of generated files. Edit freely: the loop only adds this file when a
# repository has none, and never overwrites one.
language: en-US
reviews:
  profile: chill
  auto_approvals:
    enabled: false
  poem: false
  sequence_diagrams: false
  changed_files_summary: false
  collapse_walkthrough: true
  path_filters:
    - "!flake.lock"
    - "!**/*.lock"
    - "!**/recordings/**"
    - "!**/*.cast"
    - "!**/*.gif"
  path_instructions:
    - path: "**/SPEC.md"
      instructions: >-
        Rows in the task (§T) table have exactly three `|`-separated fields
        (status, id, goal); status is `x` done or `d` decomposed, and cites
        such as `[§V.9, §B.1]` sit at the end of the goal. Bugs (§B) are a
        numbered list; a fixed bug keeps its number with a struck-through
        title. Cited ids must be declared in this spec. Do not suggest
        rewriting the notation itself.
chat:
  auto_reply: false
