---
name: Update Nix Flake Pins

on:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

jobs:
  update-pins:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: cachix/install-nix-action@v31
        with:
          nix_path: nixpkgs=channel:nixos-unstable
      - run: nix flake update
      - uses: peter-evans/create-pull-request@v7
        with:
          commit-message: "chore: update nix flake pins"
          title: "chore: update nix flake pins"
          branch: automated/update-pins
          delete-branch: true
